<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Auditing Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h2><i class="fas fa-user-shield"></i> Administration Auditing Portal</h2>
            <div class="admin-actions">
            <button id="exportExcelBtn" class="btn-export"><i class="fas fa-file-excel"></i> Export to Excel</button>
            <button id="clearLogsBtn" class="btn-danger"><i class="fas fa-trash-alt"></i> Clear Data Matrix</button>
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Main Panel</a>
            </div>
        </div>

        <!-- Tab Navigation Bar -->
        <div class="admin-tabs" style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color, #e2e8f0); padding-bottom: 10px;">
            <button type="button" id="tabAuditBtn" class="admin-tab-btn active" style="padding: 8px 16px; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid var(--border-color, #e2e8f0); background: var(--primary, #2563eb); color: white;">
                <i class="fas fa-list-alt"></i> Audit Logs
            </button>
            <button type="button" id="tabFeedbackBtn" class="admin-tab-btn" style="padding: 8px 16px; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid var(--border-color, #e2e8f0); background: transparent; color: inherit;">
                <i class="fas fa-comment-alt"></i> Feedback Notes
            </button>
        </div>

        <!-- Audit Logs Section -->
        <div id="auditSection" class="admin-tab-content">
            <p class="admin-subtitle">Operational session trace logs analyzing script runtime execution parameters:</p>
            <div class="table-responsive">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th>Agent ID</th>
                            <th>Session Start</th>
                            <th>Session End</th>
                            <th class="text-center">Auto-Docs Used?</th>
                        </tr>
                    </thead>
                    <tbody id="adminAuditLogBody">
                        <!-- Telemetry variables inject here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Feedback Notes Section -->
        <div id="feedbackSection" class="admin-tab-content" style="display: none;">
            <p class="admin-subtitle">Collected user feedback submissions, feature requests, and error notes:</p>
            <div class="table-responsive">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Category</th>
                            <th>Comments / Message</th>
                        </tr>
                    </thead>
                    <tbody id="adminFeedbackLogBody">
                        <!-- Feedback logs inject here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Load scripts at the bottom -->
    <script src="admin.js"></script>

</body>
</html>
